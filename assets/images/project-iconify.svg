<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="icoDarkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0F14"/>
      <stop offset="100%" stop-color="#08090C"/>
    </linearGradient>
    <filter id="cardShadowDark3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#icoDarkGrad)"/>
  <line x1="0" y1="40" x2="800" y2="40" stroke="#1F2128" stroke-width="1"/>
  <line x1="0" y1="460" x2="800" y2="460" stroke="#1F2128" stroke-width="1"/>

  <!-- Window Container -->
  <g transform="translate(40, 30)">
    <rect width="720" height="440" rx="10" fill="#111217" stroke="#22242C" stroke-width="1.5" filter="url(#cardShadowDark3)"/>

    <!-- Top Window Bar -->
    <path d="M 0 10 Q 0 0 10 0 L 710 0 Q 720 0 720 10 L 720 40 L 0 40 Z" fill="#16171F"/>
    <line x1="0" y1="40" x2="720" y2="40" stroke="#22242C" stroke-width="1"/>
    
    <!-- Controls -->
    <circle cx="22" cy="20" r="4.5" fill="#EF4444"/>
    <circle cx="38" cy="20" r="4.5" fill="#F59E0B"/>
    <circle cx="54" cy="20" r="4.5" fill="#10B981"/>
    
    <!-- Address Bar -->
    <rect x="180" y="10" width="360" height="20" rx="4" fill="#0C0D11" stroke="#22242C" stroke-width="1"/>
    <text x="360" y="24" font-family="'JetBrains Mono', monospace" font-size="9" fill="#10B981" text-anchor="middle">https://iconify-stream.vercel.app</text>

    <!-- Header -->
    <g transform="translate(30, 58)">
      <text font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#EDEDED">Iconify Studio</text>
      <text x="110" y="0" font-family="'JetBrains Mono', monospace" font-size="9" fill="#10B981">· TIKTOK LIVE BROADCAST ASSET SUITE</text>
      <line x1="0" y1="16" x2="660" y2="16" stroke="#1F2128" stroke-width="1"/>
    </g>

    <!-- Showcase Layout -->
    <g transform="translate(30, 92)">
      <!-- Left: Mobile Stream Viewport (9:16 aspect preview) -->
      <g transform="translate(0, 0)">
        <rect width="180" height="295" rx="16" fill="#090A0C" stroke="#22242C" stroke-width="2"/>
        
        <!-- Stream Screen Background inside Phone -->
        <rect x="6" y="6" width="168" height="283" rx="12" fill="#16171F"/>
        
        <!-- Live Badge -->
        <rect x="14" y="16" width="42" height="16" rx="3" fill="#EF4444"/>
        <text x="35" y="27" font-family="'Inter', sans-serif" font-size="8" font-weight="700" fill="#FFFFFF" text-anchor="middle">LIVE</text>
        <text x="62" y="28" font-family="'JetBrains Mono', monospace" font-size="8" fill="#EDEDED">12.4k</text>

        <!-- Dynamic Lower Third Overlay (Designed by Franc) -->
        <rect x="12" y="195" width="156" height="52" rx="6" fill="#111217" stroke="#22242C" stroke-width="1" opacity="0.95"/>
        <text x="20" y="210" font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="700" fill="#10B981">FLASH DROP 02</text>
        <text x="20" y="224" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#EDEDED">Summer Essentials Kit</text>
        <text x="20" y="238" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="600" fill="#F59E0B">₱ 599 · Limited Qty</text>

        <!-- CTA Pill -->
        <rect x="12" y="254" width="156" height="22" rx="4" fill="#10B981"/>
        <text x="90" y="268" font-family="'Inter', sans-serif" font-size="8" font-weight="700" fill="#090A0C" text-anchor="middle">Tap to Claim Voucher</text>
      </g>

      <!-- Right: Asset Breakdown & Brand Packaging -->
      <g transform="translate(205, 0)">
        <text font-family="'JetBrains Mono', monospace" font-size="9" fill="#10B981" letter-spacing="0.5">CONTRACTUAL PRODUCTION · LIVE MARKETING CAMPAIGN</text>
        <text y="24" font-family="'Inter', sans-serif" font-size="18" font-weight="700" fill="#EDEDED">TikTok Live Stream Visual Identity &amp; Overlays</text>
        
        <text y="48" font-family="'Inter', sans-serif" font-size="10.5" fill="#9CA3AF">Created dynamic broadcast assets, real-time overlays, lower-thirds, and promotional banners.</text>

        <!-- Asset Cards Grid -->
        <g transform="translate(0, 68)">
          <!-- Asset 1 -->
          <rect width="215" height="95" rx="6" fill="#14161D" stroke="#22242C" stroke-width="1"/>
          <text x="14" y="22" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#10B981">STREAM OVERLAYS</text>
          <text x="14" y="42" font-family="'Inter', sans-serif" font-size="11.5" font-weight="600" fill="#EDEDED">Lower Thirds &amp; Cards</text>
          <text x="14" y="60" font-family="'Inter', sans-serif" font-size="9" fill="#71717A">Optimized for vertical viewports, high contrast, and rapid scanning.</text>
          <text x="14" y="82" font-family="'JetBrains Mono', monospace" font-size="8" fill="#10B981">✓ 100% Brand Compliant</text>

          <!-- Asset 2 -->
          <g transform="translate(228, 0)">
            <rect width="215" height="95" rx="6" fill="#14161D" stroke="#22242C" stroke-width="1"/>
            <text x="14" y="22" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#10B981">ENGAGEMENT GRAPHICS</text>
            <text x="14" y="42" font-family="'Inter', sans-serif" font-size="11.5" font-weight="600" fill="#EDEDED">Milestone Banners</text>
            <text x="14" y="60" font-family="'Inter', sans-serif" font-size="9" fill="#71717A">Interactive visual milestones that elevated viewer retention.</text>
            <text x="14" y="82" font-family="'JetBrains Mono', monospace" font-size="8" fill="#10B981">✓ Delivered on 24h Turnaround</text>
          </g>

          <!-- Asset 3 -->
          <g transform="translate(0, 108)">
            <rect width="443" height="90" rx="6" fill="#14161D" stroke="#22242C" stroke-width="1"/>
            <text x="14" y="22" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#10B981">BRAND CO-CREATION</text>
            <text x="14" y="42" font-family="'Inter', sans-serif" font-size="11.5" font-weight="600" fill="#EDEDED">Multi-Brand Livestream Adaptability</text>
            <text x="14" y="60" font-family="'Inter', sans-serif" font-size="9" fill="#71717A">Collaborated with partner brands to translate diverse visual identities into production-ready graphics under fast turnaround pressures.</text>
            <text x="14" y="78" font-family="'JetBrains Mono', monospace" font-size="8" fill="#9CA3AF">Tools: Adobe Photoshop · Adobe Illustrator · Canva</text>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
